name: Publish to npm

on:
  release:
    types: [created]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm (OIDC trusted publishing needs a recent npm CLI)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm install

      - name: Install fixture dependencies
        run: pip install --break-system-packages pillow piexif reportlab qrcode

      - name: Generate test fixtures
        run: |
          mkdir -p /tmp/test-fixtures
          python3 -c "
          from PIL import Image
          import piexif
          from reportlab.pdfgen import canvas
          img = Image.new('RGB', (50, 50), color=(100, 150, 200))
          exif_dict = {'GPS': {piexif.GPSIFD.GPSLatitudeRef: b'N', piexif.GPSIFD.GPSLatitude: ((48,1),(51,1),(0,1))}}
          img.save('/tmp/test-fixtures/photo.jpg', 'jpeg', exif=piexif.dump(exif_dict), quality=90)
          img_gradient = Image.new('RGB', (20, 20))
          gradient_pixels = img_gradient.load()
          for x in range(20):
              for y in range(20):
                  gradient_pixels[x, y] = (x * 12, y * 12, (x + y) * 6)
          img_gradient.save('/tmp/test-fixtures/photo.png')
          for i in [1, 2]:
              c = canvas.Canvas(f'/tmp/test-fixtures/doc{i}.pdf')
              c.drawString(100, 750, f'Test doc {i}')
              c.showPage()
              c.save()
          img_a = Image.new('RGB', (200, 200))
          pixels = img_a.load()
          for x in range(200):
              for y in range(200):
                  pixels[x, y] = (x, y, (x + y) % 256)
          img_a.save('/tmp/test-fixtures/similar_a.png')
          img_a.save('/tmp/test-fixtures/similar_a2.jpg', quality=60)
          import qrcode
          qrcode.make('https://presend.pages.dev').save('/tmp/test-fixtures/qr_url.png')
          "

      - name: Run test suite against live API
        run: npm test

      - name: Publish with provenance
        run: npm publish --provenance --access public
